[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qera-mxint4-full-ag"
version = "0.1.0"
description = "Config-driven MXINT4 low-rank correction experiments with diagonal/full A and G metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.44",
  "accelerate>=0.33",
  "datasets>=3.0",
  "safetensors>=0.4",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
qera-exp = "qera_exp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
